<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Hedge Bot — Dashboard</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0e14; color: #e6e6e6; margin: 0; padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #7a869a; font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .card { background: #141925; border: 1px solid #222a3a; border-radius: 12px; padding: 16px; }
    .card h2 { font-size: 14px; margin: 0 0 12px; color: #9fb0c9; font-weight: 600; }
    pre#signals { background: #0b0e14; border-radius: 8px; padding: 12px; font-size: 12px;
                  overflow: auto; max-height: 260px; color: #8fe3a8; }
    .kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .kpi { background: #141925; border: 1px solid #222a3a; border-radius: 12px;
           padding: 12px 18px; min-width: 130px; }
    .kpi .label { font-size: 11px; color: #7a869a; text-transform: uppercase; letter-spacing: .04em; }
    .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>🚀 Quantum Hedge Bot — Dashboard</h1>
  <div class="sub">Temps réel via SocketIO · métriques via REST</div>

  <div class="kpis">
    <div class="kpi"><div class="label">Capital</div><div class="value" id="kpiCapital">—</div></div>
    <div class="kpi"><div class="label">Drawdown</div><div class="value" id="kpiDD">—</div></div>
    <div class="kpi"><div class="label">P&L réalisé</div><div class="value" id="kpiPnl">—</div></div>
    <div class="kpi"><div class="label">Trading</div><div class="value" id="kpiHalt">—</div></div>
  </div>

  <div class="grid">
    <div class="card"><h2>Prix</h2><canvas id="priceChart"></canvas></div>
    <div class="card"><h2>Capital</h2><canvas id="capitalChart"></canvas></div>
    <div class="card"><h2>Drawdown (%)</h2><canvas id="drawdownChart"></canvas></div>
    <div class="card"><h2>Derniers signaux</h2><pre id="signals">en attente…</pre></div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
